title: NOWPayments API Vocabulary
description: Domain vocabulary for the NOWPayments cryptocurrency payment gateway API

terms:
  - term: payment
    definition: >
      A cryptocurrency payment transaction initiated by a merchant. A payment has
      a target pay_address and tracks the status from waiting through to finished
      or failed.

  - term: payment_status
    definition: >
      The lifecycle state of a payment. Possible values: waiting (pending customer
      action), confirming (blockchain confirmations in progress), confirmed (enough
      confirmations received), sending (funds being forwarded), partially_paid
      (customer sent less than required), finished (payment complete), failed
      (transaction failed), refunded (funds returned), expired (payment window
      closed without payment).

  - term: invoice
    definition: >
      A hosted payment page generated by NOWPayments. The merchant shares the
      invoice_url with customers, who complete payment on the NOWPayments platform.

  - term: payout
    definition: >
      A mass cryptocurrency transfer batch allowing merchants to send funds to
      multiple wallet addresses in a single API call. Used for payroll, affiliate
      rewards, and bulk distributions.

  - term: pay_address
    definition: >
      The blockchain wallet address customers must send cryptocurrency to in order
      to complete a payment.

  - term: pay_currency
    definition: >
      The cryptocurrency denomination in which the customer sends payment
      (e.g., btc, eth, ltc, usdt).

  - term: price_currency
    definition: >
      The fiat currency in which the merchant specifies the payment price
      (e.g., usd, eur). NOWPayments converts this to the equivalent crypto amount.

  - term: price_amount
    definition: >
      The merchant-defined price in fiat currency. NOWPayments calculates the
      equivalent crypto amount at current exchange rates.

  - term: pay_amount
    definition: >
      The exact cryptocurrency amount the customer must send. Derived from
      price_amount / price_currency conversion, or set directly by the merchant.

  - term: actually_paid
    definition: >
      The cryptocurrency amount actually received from the customer so far.
      May differ from pay_amount in partial payment scenarios.

  - term: ipn_callback_url
    definition: >
      Instant Payment Notification URL. NOWPayments sends POST requests to this
      URL when payment status changes, enabling real-time order processing.

  - term: purchase_id
    definition: >
      An identifier grouping multiple payments under a single purchase context.

  - term: outcome_amount
    definition: >
      The cryptocurrency amount credited to the merchant after any automatic
      coin conversion fees.

  - term: fixed_rate
    definition: >
      A flag indicating whether the exchange rate should be locked at payment
      creation time, protecting against crypto price fluctuations during checkout.

  - term: withdrawal
    definition: >
      An individual transfer within a mass payout batch, specifying a recipient
      address, cryptocurrency, and amount.

  - term: IPN
    definition: >
      Instant Payment Notification. A webhook mechanism that notifies merchants
      of real-time payment status changes via HTTP POST to their configured
      callback URL.

  - term: auto_conversion
    definition: >
      NOWPayments feature that automatically converts received cryptocurrency
      into the merchant's preferred payout currency.

  - term: sandbox
    definition: >
      A test environment (api.sandbox.nowpayments.io) where merchants can
      simulate payments without real cryptocurrency transactions.
