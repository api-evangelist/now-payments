apis:
- name: NOWPayments Mass Payouts API
  description: >-
    Bulk cryptocurrency payout API enabling merchants to initiate thousands of transactions to different
    addresses in a single API call. Designed for payroll, affiliate rewards, and mass distribution. No
    service fees — only blockchain network fees apply.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://nowpayments.io/api/mass-payments
  baseURL: https://api.nowpayments.io/v1
