name: NOWPayments
description: NOWPayments is a crypto payment gateway that enables businesses to accept 300+ cryptocurrencies, create payment invoices, process recurring subscriptions, and manage merchant mass payouts. Founded in 2019, the platform processes over 30 million transactions monthly with 99.99% uptime and supports automatic coin conversion and fiat settlements.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
url: https://raw.githubusercontent.com/api-evangelist/now-payments/refs/heads/main/apis.yml
version: "0.19"
created: "2026-06-13"
modified: "2026-06-13"

tags:
  - Crypto Payments
  - Cryptocurrency
  - Payment Gateway
  - Invoicing
  - Subscriptions
  - Mass Payouts
  - Bitcoin
  - Ethereum

apis:
  - name: NOWPayments Payment API
    description: Core REST API for accepting cryptocurrency payments in 300+ coins, creating payments and invoices, checking payment status, and managing transaction history. Supports automatic coin conversion, IPN webhooks, and fiat withdrawals.
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    humanURL: https://nowpayments.io/help/api
    baseURL: https://api.nowpayments.io/v1
    tags:
      - Crypto Payments
      - Invoicing
      - Payment Status
      - Webhooks
    properties:
      - type: Documentation
        url: https://nowpayments.io/help/api
      - type: PostmanCollection
        url: https://documenter.getpostman.com/view/7907941/S1a32n38
      - type: Sandbox
        url: https://api.sandbox.nowpayments.io/v1
      - type: OpenAPI
        url: https://raw.githubusercontent.com/api-evangelist/now-payments/refs/heads/main/openapi/openapi.yml
    contact:
      - FN: NOWPayments Support
        email: support@nowpayments.io
        url: https://nowpayments.io/help

  - name: NOWPayments Mass Payouts API
    description: Bulk cryptocurrency payout API enabling merchants to initiate thousands of transactions to different addresses in a single API call. Designed for payroll, affiliate rewards, and mass distribution. No service fees — only blockchain network fees apply.
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    humanURL: https://nowpayments.io/api/mass-payments
    baseURL: https://api.nowpayments.io/v1
    tags:
      - Mass Payouts
      - Payroll
      - Bulk Payments
      - Cryptocurrency
    properties:
      - type: Documentation
        url: https://nowpayments.io/api/mass-payments
      - type: PostmanCollection
        url: https://documenter.getpostman.com/view/7907941/S1a32n38
    contact:
      - FN: NOWPayments Partnerships
        email: partners@nowpayments.io
        url: https://nowpayments.io/api/mass-payments

  - name: NOWPayments Recurring Payments API
    description: Subscription-based recurring crypto billing API that automates payment flows for SaaS and membership platforms, allowing merchants to charge customers on scheduled intervals in cryptocurrency.
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    humanURL: https://nowpayments.io/api
    baseURL: https://api.nowpayments.io/v1
    tags:
      - Subscriptions
      - Recurring Payments
      - Billing
      - Cryptocurrency
    properties:
      - type: Documentation
        url: https://nowpayments.io/api
    contact:
      - FN: NOWPayments Support
        email: support@nowpayments.io
        url: https://nowpayments.io/help

  - name: NOWPayments Custody API
    description: Fund custody management API enabling limitless off-chain operations, sub-account creation, and controlled fund management for B2B flows and platform operators managing multiple merchant wallets.
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    humanURL: https://nowpayments.io/api
    baseURL: https://api.nowpayments.io/v1
    tags:
      - Custody
      - Fund Management
      - Sub-accounts
      - Cryptocurrency
    properties:
      - type: Documentation
        url: https://nowpayments.io/api
    contact:
      - FN: NOWPayments Partnerships
        email: partners@nowpayments.io
        url: https://nowpayments.io/api

